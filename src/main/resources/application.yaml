management:
  endpoints:
    jmx:
      exposure:
        include: "*"

server:
  port: 8081

spring:
  application:
    name: ecommerce-backend
  datasource:
    # MySQL Database Configuration
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    #database-platform: "org.hibernate.dialect.MySQL8Dialect"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fishing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/fishing/protocol/openid-connect/certs}

jwt:
  auth:
    converter:
      resource-id: fishing-rest-api
      principal-attribute: preferred_username

logging:
  level:
    org:
      springframework:
        security: DEBUG
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"

debug: true

server-url: ${KEYCLOAK_SERVER_URL:http://ecommerce-keycloak:8080/}
admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
app-realm: ${KEYCLOAK_APP_REALM:fishing}
client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
grant-type: ${KEYCLOAK_ADMIN_GRANT_TYPE:password}
name: ${KEYCLOAK_ADMIN_USERNAME:admin}
password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
clientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}