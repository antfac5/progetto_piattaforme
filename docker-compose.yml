services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  ecommerce-backend:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - keycloak
    environment:
      KEYCLOAK_SERVER_URL: "http://ecommerce-keycloak:8080/"
      KEYCLOAK_ISSUER_URI: "http://ecommerce-keycloak:8080/realms/fishing"
      KEYCLOAK_JWK_SET_URI: "http://ecommerce-keycloak:8080/realms/fishing/protocol/openid-connect/certs"
      KEYCLOAK_ADMIN_REALM: "master"
      KEYCLOAK_APP_REALM: "fishing"
      KEYCLOAK_ADMIN_CLIENT_ID: "admin-cli"
      KEYCLOAK_ADMIN_GRANT_TYPE: "password"
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      DB_URL: jdbc:mysql://mysql:3306/ecommerce_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: ecommerce-keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  mysql_data: